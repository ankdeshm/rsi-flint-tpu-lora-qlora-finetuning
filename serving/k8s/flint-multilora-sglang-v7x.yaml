apiVersion: batch/v1
kind: Job
metadata:
  name: flint-opt-sglang-rqkr
  namespace: default
  labels:
    app: flint-opt-sglang-rqkr
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: flint-opt-sglang-rqkr
      annotations:
        gke-gcsfuse/volumes: "true"
        gke-gcsfuse/cpu-limit: "0"
        gke-gcsfuse/memory-limit: "0"
        gke-gcsfuse/ephemeral-storage-limit: "0"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 10
      serviceAccountName: default
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v7x-8-pool
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x2
        kubernetes.io/hostname: tpu-v7x-worker-0
      tolerations:
      - {key: google.com/tpu, operator: Exists, effect: NoSchedule}
      - {key: cloud.google.com/gke-queued, operator: Exists, effect: NoSchedule}
      - {key: cloud.google.com/gke-spot, operator: Exists, effect: NoSchedule}
      containers:
      - name: flint-tpu
        image: us-central1-docker.pkg.dev/your-gcp-project-id/vllm/sglang-torchtpu-diffusion:v0.2.0
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        command: ["bash", "-lc"]
        args:
        - |
          set -euo pipefail
          ulimit -c 0 || true
          mkdir -p /dev/shm/flint_work /dev/shm/hf_cache /dev/shm/xla_cache /dev/shm/tmp /workspace/logs /workspace/results
          echo "[rqkr] Host=$(hostname) Bootstrapping Flint SGLang environment..."
          if [ -f /models/models/RecursiveSI/flint/sglang/flint_sglang-0.1.4-py3-none-any.whl ]; then
            pip install --no-deps /models/models/RecursiveSI/flint/sglang/flint_sglang-0.1.4-py3-none-any.whl
          fi
          if [ -d /models/flint-v7x-scripts ]; then
            cp -f /models/flint-v7x-scripts/* /workspace/ || true
          fi
          if [ -f /workspace/patch_flint_sglang_tpu.py ]; then
            python3 /workspace/patch_flint_sglang_tpu.py
          fi
          if [ -f /workspace/metadata_hook.c ]; then
            gcc -shared -fPIC -O2 -o /workspace/metadata_hook.so /workspace/metadata_hook.c -ldl
          fi
          grep -q "127.0.0.1 metadata.google.internal" /etc/hosts || echo "127.0.0.1 metadata.google.internal" >> /etc/hosts
          if [ -f /workspace/mock_metadata.py ]; then
            nohup python3 /workspace/mock_metadata.py >/workspace/mock_metadata.log 2>&1 &
          fi
          python3 - <<'PY'
          import concurrent.futures, pathlib, shutil, time
          src = pathlib.Path("/models/models/RecursiveSI/flint")
          dst = pathlib.Path("/dev/shm/flint")
          dst.mkdir(parents=True, exist_ok=True)
          marker = dst / ".staged_ok"
          if not marker.exists() and src.exists():
              t0 = time.time()
              files = [p for p in src.rglob("*") if p.is_file() and ".cache" not in p.parts]
              def copy_one(p):
                  rel = p.relative_to(src)
                  out = dst / rel
                  out.parent.mkdir(parents=True, exist_ok=True)
                  if out.exists() and out.stat().st_size == p.stat().st_size:
                      return p.stat().st_size
                  shutil.copyfile(p, out)
                  return p.stat().st_size
              with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
                  total = sum(ex.map(copy_one, files))
              marker.write_text("ok\n")
              dt = max(time.time() - t0, 1e-3)
              print(f"Staged BF16 {total/1e9:.2f} GB to /dev/shm/flint in {dt:.1f}s ({total/1e9/dt:.2f} GB/s)", flush=True)
          PY
          if [ -f /workspace/convert_flint_fp8.py ]; then
            python3 /workspace/convert_flint_fp8.py --src /dev/shm/flint --dst /dev/shm/flint-fp8 --workers 15
          fi
          df -h /dev/shm
          echo "[rqkr] READY_FOR_BENCHMARKS"
          sleep infinity
        env:
        - {name: PJRT_DEVICE, value: "TPU"}
        - name: HF_TOKEN
          valueFrom: {secretKeyRef: {name: hf-token, key: HF_TOKEN}}
        resources:
          requests: {google.com/tpu: "4", cpu: "32", memory: 240Gi}
          limits: {google.com/tpu: "4"}
        volumeMounts:
        - {name: models-gcs, mountPath: /models}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: models-gcs
        persistentVolumeClaim: {claimName: tpu-models-gcs-pvc}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 450Gi}
