apiVersion: v1
kind: Service
metadata:
  name: flint-lora-ft-svc
  namespace: default
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: flint-lora-ft-v5p16
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flint-lora-ft-v5p16
  namespace: default
  labels:
    app: flint-lora-ft-v5p16
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: flint-lora-ft-v5p16
      annotations:
        gke-gcsfuse/volumes: "true"
        gke-gcsfuse/cpu-limit: "0"
        gke-gcsfuse/memory-limit: "0"
        gke-gcsfuse/ephemeral-storage-limit: "0"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: default
      subdomain: flint-lora-ft-svc
      terminationGracePeriodSeconds: 5
      restartPolicy: OnFailure
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v5p-16-pool
        cloud.google.com/gke-tpu-accelerator: tpu-v5p-slice
        cloud.google.com/gke-tpu-topology: 2x2x4
      tolerations:
      - {key: "google.com/tpu", operator: "Exists", effect: "NoSchedule"}
      - {key: "cloud.google.com/gke-spot", operator: "Exists", effect: "NoSchedule"}
      containers:
      - name: trainer
        image: us-central1-docker.pkg.dev/your-gcp-project-id/torchtpu/torchtitan-flint:v0.2.0
        imagePullPolicy: IfNotPresent
        command: ["bash", "-c"]
        args:
        - |
          ulimit -c 0 || true
          mkdir -p /dev/shm/code /dev/shm/logs /dev/shm/flint_ckpt /dev/shm/hf_cache /dev/shm/xla_cache /dev/shm/tmp
          echo "[flint-lora-ft-${JOB_COMPLETION_INDEX:-0}] $(hostname) ready"
          sleep infinity
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef: {name: hf-token, key: HF_TOKEN}
        - {name: PJRT_DEVICE, value: "TPU"}
        - {name: HF_HOME, value: "/dev/shm/hf_cache"}
        - {name: XLA_CACHE_DIR, value: "/dev/shm/xla_cache"}
        - {name: TMPDIR, value: "/dev/shm/tmp"}
        resources:
          requests: {google.com/tpu: "4", cpu: "64", memory: 300Gi}
          limits: {google.com/tpu: "4"}
        volumeMounts:
        - {name: models-gcs, mountPath: /models}
        - {name: dshm, mountPath: /dev/shm}
        - {name: ramtmp, mountPath: /tmp}
      volumes:
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 240Gi}
      - name: ramtmp
        emptyDir: {medium: Memory, sizeLimit: 32Gi}
      - name: models-gcs
        persistentVolumeClaim:
          claimName: tpu-models-gcs-pvc
